name: Sign and notarize macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag on master (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    # Dispatch this workflow from master, never from a PR or an arbitrary branch.
    if: github.repository == 'zzxzzk115/OmniLyrics' && github.ref == 'refs/heads/master'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      artifact: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve a release tag already merged into master
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" HEAD
          git checkout --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Release $RELEASE_TAG: $commit" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Build both app bundles without signing credentials
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          version=$(dotnet msbuild src/OmniLyrics.Gui/OmniLyrics.Gui.csproj -getProperty:Version)
          [[ "v$version" == "$RELEASE_TAG" ]] || { echo 'Tag and application version differ'; exit 1; }
          iconutil -c icns src/OmniLyrics.Gui/Assets/AppIcon.iconset -o src/OmniLyrics.Gui/Assets/app.icns
          dotnet restore src/OmniLyrics.Gui -p:RuntimeIdentifier=
          mkdir unsigned
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/OmniLyrics.Gui -c Release -r "$rid" --self-contained true \
              -p:IncludeNativeLibrariesForSelfExtract=false -o "release-work/$rid/publish"
            bash build/macos/package.sh "release-work/$rid/publish" "release-work/$rid/package" "$version"
            cp "release-work/$rid/package/OmniLyrics.app.zip" "unsigned/$rid.zip"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: unsigned
        with:
          name: unsigned-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned/*.zip
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: unsigned
      - name: Sign, notarize, staple and verify both architectures
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash build/macos/ci-sign-notarize.sh
      - name: Remove temporary credentials even after cancellation or failure
        if: always()
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/omnilyrics-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/omnilyrics-signing.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarized-macos-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Describe verified release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          echo "Signed and notarized $RELEASE_TAG ($RELEASE_COMMIT)." >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the notarized-macos artifact: two stapled app ZIPs, SHA256SUMS-macos-signed and omnilyrics.rb.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Upload the ZIPs and checksum manifest to that release, then update the tap with the generated Cask.' >> "$GITHUB_STEP_SUMMARY"
